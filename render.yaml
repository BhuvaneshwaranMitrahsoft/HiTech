services:
  - type: static
    name: HiTech
    buildCommand: npm run build
    staticPublishPath: ./dist/hi-tech
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /data/*
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
