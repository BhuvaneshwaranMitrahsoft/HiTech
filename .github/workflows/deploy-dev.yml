name: Deploy to Render (Development)

on:
  push:
    branches:
      - develop

jobs:
  quality-gate:
    name: Quality Gate
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to Dev
    needs: quality-gate
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Dev Deployment Hook
        if: env.RENDER_DEV_DEPLOY_HOOK != ''
        env:
          RENDER_DEV_DEPLOY_HOOK: ${{ secrets.RENDER_DEV_DEPLOY_HOOK }}
        run: |
          curl -X POST "$RENDER_DEV_DEPLOY_HOOK"

      - name: Alternative Render API Deploy
        if: env.RENDER_API_KEY != '' && env.RENDER_DEV_SERVICE_ID != ''
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_DEV_SERVICE_ID: ${{ secrets.RENDER_DEV_SERVICE_ID }}
        run: |
          curl -X POST "https://api.render.com/v1/services/$RENDER_DEV_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json"
